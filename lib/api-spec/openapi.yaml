openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Pterodactyl Backup Bot API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bot
    description: Bot control operations
  - name: telegram
    description: Telegram client operations

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /bot/config:
    get:
      operationId: getConfig
      tags: [bot]
      summary: Get saved bot configuration
      responses:
        "200":
          description: Current saved config or null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotConfigResult"
    post:
      operationId: saveConfig
      tags: [bot]
      summary: Save bot configuration to database
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotConfig"
      responses:
        "200":
          description: Config saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bot/start:
    post:
      operationId: startBot
      tags: [bot]
      summary: Start the backup bot
      responses:
        "200":
          description: Bot started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Config missing or bot already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bot/stop:
    post:
      operationId: stopBot
      tags: [bot]
      summary: Stop the backup bot
      responses:
        "200":
          description: Bot stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Bot not running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bot/status:
    get:
      operationId: getBotStatus
      tags: [bot]
      summary: Get current bot status and stats
      responses:
        "200":
          description: Bot status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotStatus"

  /telegram/init:
    post:
      operationId: initTelegram
      tags: [telegram]
      summary: Initialize Telegram MTProto client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramInitInput"
      responses:
        "200":
          description: Client initialized, OTP sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /telegram/verify:
    post:
      operationId: verifyTelegramOtp
      tags: [telegram]
      summary: Submit OTP to complete Telegram authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TelegramOtpInput"
      responses:
        "200":
          description: Authenticated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Invalid OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /telegram/status:
    get:
      operationId: getTelegramStatus
      tags: [telegram]
      summary: Get Telegram client authentication status
      responses:
        "200":
          description: Telegram status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TelegramStatus"

  /telegram/disconnect:
    post:
      operationId: disconnectTelegram
      tags: [telegram]
      summary: Disconnect and wipe Telegram session from memory
      responses:
        "200":
          description: Disconnected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success
        - message

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    BotConfigResult:
      type: object
      properties:
        config:
          oneOf:
            - $ref: "#/components/schemas/SavedConfig"
            - type: "null"
      required:
        - config

    SavedConfig:
      type: object
      properties:
        panelUrl:
          type: string
        apiKey:
          type: string
        serverId:
          type: string
        backupIntervalMinutes:
          type: number
      required:
        - panelUrl
        - apiKey
        - serverId
        - backupIntervalMinutes

    BotConfig:
      type: object
      properties:
        panelUrl:
          type: string
        apiKey:
          type: string
        serverId:
          type: string
        backupIntervalMinutes:
          type: number
      required:
        - panelUrl
        - apiKey
        - serverId

    BotStatus:
      type: object
      properties:
        running:
          type: boolean
        configured:
          type: boolean
        lastBackupAt:
          type: ["string", "null"]
        backupCount:
          type: integer
        currentAction:
          type: ["string", "null"]
        uptime:
          type: ["number", "null"]
      required:
        - running
        - configured
        - lastBackupAt
        - backupCount
        - currentAction
        - uptime

    TelegramInitInput:
      type: object
      properties:
        apiId:
          type: integer
        apiHash:
          type: string
        phoneNumber:
          type: string
      required:
        - apiId
        - apiHash
        - phoneNumber

    TelegramOtpInput:
      type: object
      properties:
        code:
          type: string
      required:
        - code

    TelegramStatus:
      type: object
      properties:
        connected:
          type: boolean
        authenticated:
          type: boolean
        awaitingOtp:
          type: boolean
        phoneNumber:
          type: ["string", "null"]
      required:
        - connected
        - authenticated
        - awaitingOtp
        - phoneNumber

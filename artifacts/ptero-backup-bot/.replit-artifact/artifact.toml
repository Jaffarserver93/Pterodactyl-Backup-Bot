kind = "web"
previewPath = "/"
title = "Ptero Backup Bot"
version = "1.0.0"
id = "artifacts/ptero-backup-bot"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21884

[services.development]
run = "pnpm --filter @workspace/ptero-backup-bot run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ptero-backup-bot", "run", "build" ]
publicDir = "artifacts/ptero-backup-bot/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21884"
BASE_PATH = "/"
